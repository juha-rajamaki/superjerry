// ── Fullscreen scaling ────────────────────────
const gameWrap = document.getElementById('game-wrap');

function resizeCanvas() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const cw = Math.floor(W * scale);
  const ch = Math.floor(H * scale);
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  gameWrap.style.width  = cw + 'px';
  gameWrap.style.height = ch + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// F key or button toggles browser fullscreen
const fsBtn = document.getElementById('fullscreen-btn');
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFullscreen(); });
document.addEventListener('fullscreenchange', resizeCanvas);

// ── Audio (Web Audio API, procedural SFX) ────
// Context created lazily; suspended between sounds to silence browser buzz.
let AC = null;
let acSuspendTimer = null;

function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  // Auto-suspend 1 second after last sound so the context goes quiet
  clearTimeout(acSuspendTimer);
  acSuspendTimer = setTimeout(() => { if (AC) AC.suspend(); }, 1000);
  return AC;
}
function resumeAC() { getAC(); }

function playTone(freq, type, duration, vol=0.3, freqEnd=null) {
  const ac = getAC();
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.type = type;
  o.frequency.setValueAtTime(freq, ac.currentTime);
  if (freqEnd !== null) o.frequency.linearRampToValueAtTime(freqEnd, ac.currentTime + duration);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
  o.start(ac.currentTime);
  o.stop(ac.currentTime + duration);
}
function sfxJump()    { playTone(300, 'square', 0.12, 0.25, 600); }
function sfxLand()    { playTone(80,  'sine',   0.08, 0.2); }
function sfxFire()    { playTone(800, 'sawtooth', 0.1, 0.15, 200); }
function sfxHit()     { playTone(100, 'sawtooth', 0.2, 0.3, 50); }
function sfxDie()     { playTone(400, 'sawtooth', 0.4, 0.4, 50); }
function sfxCoin()    { playTone(880, 'square',   0.15, 0.2, 1200); }
function sfxFireball(){ playTone(600, 'sawtooth', 0.12, 0.18, 100); }
function sfxBossHit() { playTone(150, 'sawtooth', 0.3, 0.4, 50); }
function sfxBossDie() {
  const ac = getAC();
  [0,0.1,0.2,0.3,0.4].forEach(t => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(300 - t*200, ac.currentTime + t);
    g.gain.setValueAtTime(0.4, ac.currentTime + t);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.09);
    o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.1);
  });
}
function sfxVictory() {
  const ac = getAC();
  [523,659,784,1047].forEach((f,i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.3, ac.currentTime + i*0.15);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i*0.15 + 0.3);
    o.start(ac.currentTime + i*0.15); o.stop(ac.currentTime + i*0.15 + 0.3);
  });
}

  toasts.push({msg, timer: duration, maxTimer: duration});
}
function updateToasts() {
  for (let i=toasts.length-1; i>=0; i--) {
    toasts[i].timer--;
    if (toasts[i].timer <= 0) toasts.splice(i,1);
  }
}
function drawToasts() {
  let offsetY = 50;
  for (const t of toasts) {
    const alpha = Math.min(1, t.timer / 30, (t.maxTimer - t.timer) / 20 + 0.1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(t.msg).width;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.beginPath();
    ctx.roundRect(W/2 - tw/2 - 14, offsetY - 20, tw + 28, 30, 8);
    ctx.fill();
    ctx.fillStyle = '#ffee88';
    ctx.fillText(t.msg, W/2, offsetY);
    ctx.restore();
    offsetY += 38;
  }
}

// ── Keyboard ─────────────────────────────────
const keys = {};
const justPressed = {};
// jumpBuffer: guarantees a jump keypress is seen for at least 6 frames
// even if keyup fires before the next game frame (e.g. Space blurring a button).
let jumpBuffer = 0;
const JUMP_BUFFER_FRAMES = 6;

document.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'ArrowUp') jumpBuffer = JUMP_BUFFER_FRAMES;
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ── Mobile / Touch detection ──────────────────
const isMobile = /Mobi|Android|iPhone|iPad|iPod|Touch/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1);

// Virtual button state (injected into keys/justPressed like keyboard)
const vBtn = { left:false, right:false, down:false, jump:false, fire:false, restart:false };
let prevVBtn = { left:false, right:false, down:false, jump:false, fire:false, restart:false };

function syncVirtualButtons() {
  // OR virtual buttons into keys — never overwrite real keyboard state
  if (vBtn.left)    keys['ArrowLeft']  = true;
  if (vBtn.right)   keys['ArrowRight'] = true;
  if (vBtn.down)    keys['ArrowDown']  = true;
  if (vBtn.jump  && !prevVBtn.jump)  { justPressed['KeyZ'] = true; jumpBuffer = JUMP_BUFFER_FRAMES; }
  if (vBtn.fire  && !prevVBtn.fire)    justPressed['KeyX'] = true;
  if (vBtn.restart && !prevVBtn.restart) justPressed['KeyR'] = true;
  prevVBtn = {...vBtn};
}

// ── On-screen D-pad & buttons (drawn on canvas) ──
// Button hit areas in canvas-pixel space (set in drawTouchControls)
const touchZones = {};

function defineTouchZones(cw, ch) {
  // D-pad cluster: bottom-left
  const pad = 80, btn = 70, gap = 6;
  const lx = 20, ly = ch - pad*2 - gap - 10;
  touchZones.left    = {x: lx,           y: ly + pad/2,  r: pad/2};
  touchZones.right   = {x: lx + pad*1.5, y: ly + pad/2,  r: pad/2};
  touchZones.down    = {x: lx + pad*0.75,y: ly + pad,    r: pad/2};
  // Action buttons: bottom-right
  const rx = cw - 180, ry = ch - btn*1.8 - 10;
  touchZones.jump    = {x: rx + btn,     y: ry,          r: btn/2};
  touchZones.fire    = {x: rx,           y: ry + btn*0.6,r: btn/2};
  touchZones.restart = {x: cw/2,         y: ch - 28,     r: 28, rect:true, w:80, h:28};
}

function hitTest(zone, tx, ty) {
  if (zone.rect) {
    return tx > zone.x - zone.w/2 && tx < zone.x + zone.w/2 &&
           ty > zone.y - zone.h/2 && ty < zone.y + zone.h/2;
  }
  const dx = tx - zone.x, dy = ty - zone.y;
  return dx*dx + dy*dy < zone.r*zone.r;
}

function updateVBtnFromTouches(touchList) {
  vBtn.left = vBtn.right = vBtn.down = vBtn.jump = vBtn.fire = vBtn.restart = false;
  for (let i=0; i<touchList.length; i++) {
    const t = touchList[i];
    const rect = canvas.getBoundingClientRect();
    const scaleX = 800 / rect.width;
    const scaleY = 480 / rect.height;
    const tx = (t.clientX - rect.left) * scaleX;
    const ty = (t.clientY - rect.top)  * scaleY;
    for (const [k, zone] of Object.entries(touchZones)) {
      if (hitTest(zone, tx, ty)) vBtn[k] = true;
    }
  }
}

canvas.addEventListener('touchstart',  e => {
  e.preventDefault(); resumeAC();
  // Character select: tap on preview to pick, tap center/bottom to confirm
  if (state === 'select' && e.touches.length > 0) {
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const tx = (t.clientX - rect.left) * (800 / rect.width);
    // Three columns: left=0, center=1, right=2
    if (tx < 800/3)      selectedChar = 0;
    else if (tx < 800*2/3) selectedChar = 1;
    else                 selectedChar = 2;
  }
  updateVBtnFromTouches(e.touches);
}, {passive:false});
canvas.addEventListener('touchmove',   e => { e.preventDefault(); updateVBtnFromTouches(e.touches); }, {passive:false});
canvas.addEventListener('touchend',    e => { e.preventDefault(); updateVBtnFromTouches(e.touches); }, {passive:false});
canvas.addEventListener('touchcancel', e => { e.preventDefault(); updateVBtnFromTouches(e.touches); }, {passive:false});

// ── Gamepad API ───────────────────────────────
// Standard mapping: axes 0/1 = left stick, buttons 0=A(jump) 1=B(fire) 12-15=dpad
let gamepadIndex = -1;
window.addEventListener('gamepadconnected',    e => { gamepadIndex = e.gamepad.index; });
window.addEventListener('gamepaddisconnected', e => { if (e.gamepad.index === gamepadIndex) gamepadIndex = -1; });

function pollGamepad() {
  if (gamepadIndex < 0) return;
  const gp = navigator.getGamepads ? navigator.getGamepads()[gamepadIndex] : null;
  if (!gp) return;
  const ax = gp.axes[0] ?? 0;
  const ay = gp.axes[1] ?? 0;
  // Inject as virtual buttons (merges with touch)
  if (ax < -0.4) vBtn.left  = true;
  if (ax >  0.4) vBtn.right = true;
  if (ay >  0.4) vBtn.down  = true;
  // Buttons: A=0 jump, B=1 / X=2 fire, Start=9 restart, dpad left=14 right=15 down=13
  if (gp.buttons[0]?.pressed) vBtn.jump    = true;
  if (gp.buttons[1]?.pressed || gp.buttons[2]?.pressed) vBtn.fire = true;
  if (gp.buttons[9]?.pressed) vBtn.restart = true;
  if (gp.buttons[14]?.pressed) vBtn.left   = true;
  if (gp.buttons[15]?.pressed) vBtn.right  = true;
  if (gp.buttons[13]?.pressed) vBtn.down   = true;
}

// ── Draw on-screen touch controls ────────────
function drawTouchControls() {
  if (!isMobile && gamepadIndex < 0) return; // only show on mobile or when pad connected
  defineTouchZones(W, H);

  ctx.save();
  ctx.globalAlpha = 0.45;

  function drawCircleBtn(zone, label, highlight) {
    ctx.beginPath();
    ctx.arc(zone.x, zone.y, zone.r, 0, Math.PI*2);
    ctx.fillStyle = highlight ? '#ffffff' : '#334466';
    ctx.fill();
    ctx.strokeStyle = '#aabbdd';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = highlight ? '#000' : '#fff';
    ctx.font = `bold ${Math.floor(zone.r * 0.6)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, zone.x, zone.y);
  }

  // D-pad
  drawCircleBtn(touchZones.left,  '◀', vBtn.left);
  drawCircleBtn(touchZones.right, '▶', vBtn.right);
  drawCircleBtn(touchZones.down,  '▼', vBtn.down);
  // Action buttons
  ctx.globalAlpha = 0.55;
  drawCircleBtn(touchZones.jump,  'JUMP', vBtn.jump);
  drawCircleBtn(touchZones.fire,  'FIRE', vBtn.fire);

  // Restart button on game-over / win screens; "START" on title
  if (state === 'dead' || state === 'win' || state === 'title') {
    ctx.globalAlpha = 0.7;
    const rz = touchZones.restart;
    ctx.beginPath();
    ctx.roundRect(rz.x - rz.w/2, rz.y - rz.h/2, rz.w, rz.h, 8);
    ctx.fillStyle = '#882222';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(state === 'title' ? 'START' : 'RESTART', rz.x, rz.y);
  }

  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

// ── Tile helpers ──────────────────────────────
function getTile(col, row) {
  if (col < 0 || col >= MAP_COLS || row < 0 || row >= MAP_ROWS) return 1;
  return tileMap[row][col];
}
function isSolid(t) { return t === 1 || t === 3 || t === 4; }
function isLava(t)  { return t === 2; }

// AABB collision with tile map, returns {x,y,onGround,inLava}
function moveAndCollide(entity) {
  let {x, y, vx, vy, w, h} = entity;
  let onGround = false;
  let inLava = false;

  // Move X
  x += vx;
  // Check horizontal tiles
  const col1 = Math.floor(x / TILE);
  const col2 = Math.floor((x + w - 1) / TILE);
  const row1 = Math.floor(y / TILE);
  const row2 = Math.floor((y + h - 1) / TILE);
  for (let r = row1; r <= row2; r++) {
    if (isSolid(getTile(col1, r)) && vx < 0) {
      x = (col1 + 1) * TILE;
      vx = 0;
    }
    if (isSolid(getTile(col2, r)) && vx > 0) {
      x = col2 * TILE - w;
      vx = 0;
    }
  }

  // Move Y
  y += vy;
  const col1b = Math.floor(x / TILE);
  const col2b = Math.floor((x + w - 1) / TILE);
  const row1b = Math.floor(y / TILE);
  const row2b = Math.floor((y + h - 1) / TILE);
  for (let c = col1b; c <= col2b; c++) {
    if (isSolid(getTile(c, row1b)) && vy < 0) {
      y = (row1b + 1) * TILE;
      vy = 0;
    }
    if (isSolid(getTile(c, row2b)) && vy > 0) {
      y = row2b * TILE - h;
      vy = 0;
      onGround = true;
    }
    if (isLava(getTile(c, row1b)) || isLava(getTile(c, row2b))) inLava = true;
  }

  // Check lava overlap at feet
  const footRow = Math.floor((y + h) / TILE);
  for (let c = col1b; c <= col2b; c++) {
    if (isLava(getTile(c, footRow))) inLava = true;
  }

  return {x, y, vx, vy, onGround, inLava};
}

// ── Particle system ───────────────────────────
let particles = [];
function spawnParticles(x, y, count, color, speed=3) {
  for (let i=0; i<count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * speed + 1;
    particles.push({
      x, y,
      vx: Math.cos(ang)*spd,
      vy: Math.sin(ang)*spd - 2,
      life: 30 + Math.random()*20,
      maxLife: 50,
      color,
      r: 3 + Math.random()*3,
    });
  }
}

// ── Drawing helpers ───────────────────────────
function drawPixelChar(x, y, color, size=1) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, size, size);
}

// Draw Jerry's body at origin (0,0) using given palette. scale=1 by default.
function drawJerryBody(pal, ducking=false, scale=1) {
  ctx.save();
  ctx.scale(scale, scale);
  // Overalls
  ctx.fillStyle = pal.overalls;
  ctx.fillRect(4, 14, 20, 18);
  // Shirt
  ctx.fillStyle = pal.shirt;
  ctx.fillRect(4, 8, 20, 10);
  // Skin
  ctx.fillStyle = '#f4b06a';
  ctx.fillRect(6, 2, 16, 12);
  // Cap
  ctx.fillStyle = pal.cap;
  ctx.fillRect(4, 0, 20, 6);
  ctx.fillRect(2, 4, 4, 4);
  // Eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(10, 6, 3, 3);
  ctx.fillRect(16, 6, 3, 3);
  // Mustache
  ctx.fillStyle = '#5c2e00';
  ctx.fillRect(8, 11, 12, 3);
  // Buttons
  ctx.fillStyle = '#ffdd00';
  ctx.fillRect(12, 18, 4, 3);
  // Shoes
  ctx.fillStyle = '#4a2200';
  if (ducking) {
    ctx.fillRect(2, 24, 10, 8);
    ctx.fillRect(16, 24, 10, 8);
  } else {
    ctx.fillRect(2, 28, 10, 4);
    ctx.fillRect(16, 28, 10, 4);
  }
  // Fireball badge
  ctx.fillStyle = pal.badge;
  ctx.fillRect(5,17,4,4);
  ctx.fillStyle='#ff4400';
  ctx.fillRect(6,18,2,2);
  ctx.restore();
}

function drawPlayer(p) {
  const sx = Math.round(p.x - camX);
  const sy = Math.round(p.y);
  if (p.invincible > 0 && Math.floor(frameCount/4)%2===0) return;

  const pal = CHAR_PALETTES[selectedChar];
  const flip = !p.facingRight;
  ctx.save();
  if (flip) { ctx.translate(sx + p.w/2, sy); ctx.scale(-1,1); ctx.translate(-p.w/2, 0); }
  else { ctx.translate(sx, sy); }
  drawJerryBody(pal, p.ducking);
  ctx.restore();
}

function drawBoss(b) {
  if (b.dead && b.deathTimer > 60) return;
  const sx = Math.round(b.x - camX);
  const sy = Math.round(b.y);
  const flash = b.hitFlash > 0;

  ctx.save();
  if (!b.facingRight) { ctx.translate(sx + b.w/2, sy); ctx.scale(-1,1); ctx.translate(-b.w/2,0); } else ctx.translate(sx, sy);

  // Body
  ctx.fillStyle = flash ? '#fff' : '#2a7a2a';
  ctx.fillRect(8, 16, 48, 40);
  // Head
  ctx.fillStyle = flash ? '#fff' : '#2a7a2a';
  ctx.fillRect(10, 0, 44, 24);
  // Spikes on head
  ctx.fillStyle = flash ? '#fff' : '#aa3300';
  for (let i=0; i<4; i++) ctx.fillRect(14+i*10, -8, 6, 10);
  // Eyes
  ctx.fillStyle = flash ? '#f00' : '#ff2200';
  ctx.fillRect(16, 4, 12, 10);
  ctx.fillRect(36, 4, 12, 10);
  ctx.fillStyle = '#000';
  ctx.fillRect(19, 6, 6, 6);
  ctx.fillRect(39, 6, 6, 6);
  // Teeth
  ctx.fillStyle = flash ? '#fff' : '#ffffcc';
  ctx.fillRect(16, 18, 6, 6);
  ctx.fillRect(26, 18, 6, 6);
  ctx.fillRect(36, 18, 6, 6);
  // Shell (back spikes)
  ctx.fillStyle = flash ? '#fff' : '#aa3300';
  ctx.fillRect(10, 20, 8, 10);
  ctx.fillRect(46, 20, 8, 10);
  // Arms
  ctx.fillStyle = flash ? '#fff' : '#2a7a2a';
  ctx.fillRect(0, 20, 14, 22);
  ctx.fillRect(50, 20, 14, 22);
  // Claws
  ctx.fillStyle = flash ? '#fff' : '#dddd00';
  ctx.fillRect(0, 40, 5, 5); ctx.fillRect(6, 42, 5, 5);
  ctx.fillRect(49,40, 5, 5); ctx.fillRect(55, 42, 5, 5);
  // Legs
  ctx.fillStyle = flash ? '#fff' : '#2a7a2a';
  ctx.fillRect(14, 52, 14, 12);
  ctx.fillRect(36, 52, 14, 12);
  // HP bar (always in world space)
  ctx.restore();
}

function drawHpBar(b) {
  if (!bossActive || b.dead) return;
  const barW = 300, barH = 16;
  const bx = W/2 - barW/2, by = 10;
  ctx.fillStyle = '#333';
  ctx.fillRect(bx-2, by-2, barW+4, barH+4);
  ctx.fillStyle = b.hp > b.maxHp/2 ? '#22cc22' : '#cc2222';
  ctx.fillRect(bx, by, barW * (b.hp/b.maxHp), barH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('KING KOOPARD', W/2, by + barH - 2);
}

function drawTile(col, row) {
  const t = getTile(col, row);
  const x = col*TILE - camX;
  const y = row*TILE;
  if (x > W+TILE || x < -TILE) return;

  if (t === 1) { // brick
    ctx.fillStyle = '#883322';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#aa4433';
    ctx.fillRect(x+1, y+1, TILE-2, 6);
    ctx.fillRect(x+1, y+TILE/2+1, TILE-2, 6);
    ctx.strokeStyle = '#661100';
    ctx.strokeRect(x+0.5, y+0.5, TILE-1, TILE-1);
    ctx.fillStyle = '#662211';
    ctx.fillRect(x, y+TILE/2, TILE, 2);
    ctx.fillRect(x+TILE/2, y, 2, TILE);
  } else if (t === 2) { // lava
    const flicker = Math.sin(frameCount * 0.15 + col * 0.7) * 0.5 + 0.5;
    ctx.fillStyle = `rgb(${Math.floor(200+55*flicker)}, ${Math.floor(50+30*flicker)}, 0)`;
    ctx.fillRect(x, y, TILE, TILE);
    // lava surface wave
    ctx.fillStyle = '#ffaa00';
    for (let i=0; i<TILE; i+=6) {
      const h = 4 + Math.sin(frameCount*0.1 + (col*TILE+i)*0.3)*3;
      ctx.fillRect(x+i, y, 5, h);
    }
  } else if (t === 3) { // castle wall
    ctx.fillStyle = '#555566';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#444455';
    ctx.strokeStyle = '#333344';
    ctx.strokeRect(x+0.5, y+0.5, TILE-1, TILE-1);
    // stone pattern
    if (row%2===0) {
      ctx.fillStyle = '#666677';
      ctx.fillRect(x+1, y+1, TILE/2-2, TILE-2);
    } else {
      ctx.fillStyle = '#666677';
      ctx.fillRect(x+TILE/2+1, y+1, TILE/2-2, TILE-2);
    }
  } else if (t === 4) { // castle floor
    ctx.fillStyle = '#445';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#556';
    ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
    ctx.strokeStyle = '#334';
    ctx.strokeRect(x+0.5, y+0.5, TILE-1, TILE-1);
  }
}

function drawCoin(cx, row, col) {
  if (cx.collected) return;
  const x = col*TILE + TILE/2 - camX;
  const y = row*TILE + TILE/2;
  const bob = Math.sin(frameCount*0.1 + col) * 3;
  ctx.fillStyle = '#ffdd00';
  ctx.beginPath();
  ctx.arc(x, y+bob, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ffff88';
  ctx.beginPath();
  ctx.arc(x-2, y+bob-2, 3, 0, Math.PI*2);
  ctx.fill();
}

function drawBackground() {
  // Dark castle background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0010');
  grad.addColorStop(1, '#1a0000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Glowing lava light from bottom
  const lavaGlow = ctx.createLinearGradient(0, H*0.7, 0, H);
  lavaGlow.addColorStop(0, 'rgba(200,50,0,0)');
  lavaGlow.addColorStop(1, 'rgba(200,80,0,0.25)');
  ctx.fillStyle = lavaGlow;
  ctx.fillRect(0, 0, W, H);

  // Torches on walls (fixed positions relative to camera)
  for (let tx = -camX % 160; tx < W; tx += 160) {
    const flicker = Math.sin(frameCount*0.2 + tx) * 3;
    ctx.fillStyle = '#554422';
    ctx.fillRect(tx, 80, 12, 24);
    ctx.fillStyle = `rgba(255,${Math.floor(120+flicker*10)},0,0.9)`;
    ctx.beginPath();
    ctx.arc(tx+6, 74+flicker, 10+flicker, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,200,0,0.6)`;
    ctx.beginPath();
    ctx.arc(tx+6, 72+flicker, 5+flicker/2, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 38);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`JERRY  ${score.toString().padStart(6,'0')}`, 12, 26);
  ctx.textAlign = 'center';
  ctx.fillText(`♥×${lives}   ●×${coins}`, W/2, 26);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff6644';
  ctx.fillText('LAVA CASTLE', W-12, 26);
}

// ── Game update ───────────────────────────────
function updatePlayer() {
  if (state !== 'play') return;
  const p = player;

  // Horizontal
  const running = keys['KeyX'];
  const maxSpd = running ? RUN_SPEED : SPEED;
  p.running = running && Math.abs(p.vx) > SPEED * 0.8;

  if (keys['ArrowLeft']) {
    p.vx -= 0.8;
    if (p.vx < -maxSpd) p.vx = -maxSpd;
    p.facingRight = false;
  } else if (keys['ArrowRight']) {
    p.vx += 0.8;
    if (p.vx > maxSpd) p.vx = maxSpd;
    p.facingRight = true;
  } else {
    p.vx *= 0.75;
    if (Math.abs(p.vx) < 0.1) p.vx = 0;
  }

  // Ducking
  p.ducking = keys['ArrowDown'] && p.onGround;

  // Jump — use buffer so Space/Z presses are never dropped
  if (jumpBuffer > 0 && p.onGround && !p.ducking) {
    p.vy = JUMP_FORCE;
    p.onGround = false;
    jumpBuffer = 0;
    sfxJump();
  }
  if (jumpBuffer > 0) jumpBuffer--;
  // Variable jump height: releasing jump key cuts the arc short
  if (!keys['KeyZ'] && !keys['Space'] && p.vy < -4) p.vy += 2;

  // Gravity
  p.vy += GRAV;
  if (p.vy > 18) p.vy = 18;

  const wasOnGround = p.onGround;
  const res = moveAndCollide(p);
  p.x = res.x; p.y = res.y; p.vx = res.vx; p.vy = res.vy;
  p.onGround = res.onGround;
  p.jumping = !p.onGround;

  if (!wasOnGround && p.onGround) sfxLand();

  // Fell off bottom
  if (p.y > MAP_ROWS * TILE) killPlayer();

  // Lava death
  if (res.inLava) killPlayer();

  // Fireball shoot
  if (justPressed['KeyX'] && p.fireMode && !p.ducking) {
    const dir = p.facingRight ? 1 : -1;
    playerFireballs.push({
      x: p.x + (p.facingRight ? p.w : 0),
      y: p.y + 8,
      vx: dir * FIREBALL_SPEED,
      vy: -3,
      bounces: 3,
    });
    sfxFire();
  }

  // Clamp to level
  if (p.x < TILE) p.x = TILE;
  if (p.x + p.w > (MAP_COLS - 1) * TILE) p.x = (MAP_COLS - 1) * TILE - p.w;

  // Invincibility frames
  if (p.invincible > 0) p.invincible--;

  // Coin pickup
  for (const c of coinList) {
    if (c.collected) continue;
    const cx = c.col*TILE + TILE/2;
    const cy = c.row*TILE + TILE/2;
    if (Math.abs(cx - (p.x+p.w/2)) < 20 && Math.abs(cy - (p.y+p.h/2)) < 20) {
      c.collected = true;
      coins++;
      score += 100;
      sfxCoin();
      spawnParticles(cx, cy, 6, '#ffdd00', 4);
    }
  }
}

function updatePlayerFireballs() {
  for (let i = playerFireballs.length-1; i >= 0; i--) {
    const fb = playerFireballs[i];
    fb.x += fb.vx;
    fb.vy += GRAV * 0.5;
    fb.y += fb.vy;

    // Bounce off floor
    const col = Math.floor(fb.x/TILE);
    const row = Math.floor((fb.y+6)/TILE);
    if (isSolid(getTile(col, row)) && fb.vy > 0) {
      fb.vy = -Math.abs(fb.vy) * 0.7;
      fb.bounces--;
      if (fb.bounces <= 0 || Math.abs(fb.vy) < 1) { playerFireballs.splice(i,1); continue; }
    }
    // Hit wall
    const colX = Math.floor((fb.x + (fb.vx>0?6:0))/TILE);
    if (isSolid(getTile(colX, Math.floor(fb.y/TILE)))) { playerFireballs.splice(i,1); continue; }
    // Out of bounds
    if (fb.x < 0 || fb.x > MAP_COLS*TILE || fb.y > MAP_ROWS*TILE) { playerFireballs.splice(i,1); continue; }
    // Hit lava
    if (isLava(getTile(col, row))) { playerFireballs.splice(i,1); continue; }

    // Hit boss
    if (bossActive && !boss.dead) {
      if (fb.x > boss.x && fb.x < boss.x+boss.w && fb.y > boss.y && fb.y < boss.y+boss.h) {
        boss.hp--;
        boss.hitFlash = 10;
        sfxBossHit();
        spawnParticles(fb.x, fb.y, 8, '#ff6600', 4);
        score += 500;
        playerFireballs.splice(i,1);
        if (boss.hp <= 0) { boss.dead = true; sfxBossDie(); }
        continue;
      }
    }
  }
}

function updateBoss() {
  if (!bossActive || boss.dead) {
    if (boss.dead) {
      boss.deathTimer++;
      if (boss.deathTimer > 120) { state = 'win'; sfxVictory(); }
    }
    return;
  }

  // Activate boss when player enters arena
  if (player.x > BOSS_ARENA_X - TILE*2) bossActive = true;

  if (boss.hitFlash > 0) boss.hitFlash--;

  // Phase 2 — still slower for kids
  if (boss.hp <= boss.maxHp/2) {
    boss.phase = 2;
    boss.fireCooldown = 130;
  }

  // Move
  boss.vx *= 0.98;
  boss.x += boss.vx;
  boss.vy += GRAV;
  boss.y += boss.vy;

  // Bounce off arena walls
  if (boss.x < TILE*148) { boss.x = TILE*148; boss.vx = Math.abs(boss.vx); boss.facingRight = true; }
  if (boss.x + boss.w > TILE*158) { boss.x = TILE*158-boss.w; boss.vx = -Math.abs(boss.vx); boss.facingRight = false; }

  // Land on floor
  const bRow = Math.floor((boss.y+boss.h)/TILE);
  const bCol1 = Math.floor(boss.x/TILE);
  const bCol2 = Math.floor((boss.x+boss.w-1)/TILE);
  let bOnGround = false;
  for (let c=bCol1; c<=bCol2; c++) {
    if (isSolid(getTile(c, bRow))) {
      boss.y = bRow*TILE - boss.h;
      boss.vy = 0;
      bOnGround = true;
    }
  }
  boss.onGround = bOnGround;

  // Jump periodically
  boss.jumpTimer--;
  if (boss.jumpTimer <= 0 && boss.onGround) {
    boss.vy = -8 - (boss.phase===2 ? 1 : 0);
    const dir = player.x < boss.x ? -1 : 1;
    boss.vx = dir * (1.5 + Math.random()*1.5);
    boss.facingRight = dir > 0;
    boss.jumpTimer = 150 + Math.random()*100;
    sfxJump();
  }

  // Fire at player
  boss.fireTimer--;
  if (boss.fireTimer <= 0) {
    const dx = player.x - boss.x;
    const dy = (player.y+player.h/2) - (boss.y+boss.h/2);
    const dist = Math.sqrt(dx*dx+dy*dy);
    const speed = boss.phase===2 ? 3.0 : 2.2;
    bossFireballs.push({x:boss.x+boss.w/2, y:boss.y+20, vx:dx/dist*speed, vy:dy/dist*speed});
    // Phase 2: one extra slightly off-aim shot (not triple spread)
    if (boss.phase===2) {
      bossFireballs.push({x:boss.x+boss.w/2, y:boss.y+20, vx:(dx/dist*speed)+1.0, vy:dy/dist*speed});
    }
    boss.fireTimer = boss.fireCooldown;
    sfxFireball();
  }

  // Hurt player on touch
  if (!player.invincible && player.x < boss.x+boss.w && player.x+player.w > boss.x &&
      player.y < boss.y+boss.h && player.y+player.h > boss.y) {
    hurtPlayer();
  }
}

function updateBossFireballs() {
  for (let i=bossFireballs.length-1; i>=0; i--) {
    const fb = bossFireballs[i];
    fb.x += fb.vx;
    fb.y += fb.vy;
    // Out of screen
    if (fb.x < 0||fb.x>MAP_COLS*TILE||fb.y>MAP_ROWS*TILE||fb.y<-TILE) { bossFireballs.splice(i,1); continue; }
    // Hit solid
    if (isSolid(getTile(Math.floor(fb.x/TILE),Math.floor(fb.y/TILE)))) { bossFireballs.splice(i,1); continue; }
    // Hit player
    if (!player.invincible &&
        fb.x > player.x && fb.x < player.x+player.w &&
        fb.y > player.y && fb.y < player.y+player.h) {
      hurtPlayer();
      spawnParticles(fb.x, fb.y, 6, '#ff6600', 3);
      bossFireballs.splice(i,1);
    }
  }
}

function updateWallFireballs() {
  // Emitters
  for (const em of fireballEmitters) {
    em.timer--;
    if (em.timer <= 0) {
      em.timer = 180 + Math.floor(Math.random()*90);
      wallFireballs.push({
        x: em.col*TILE + (em.dir>0 ? TILE : 0),
        y: em.row*TILE + TILE/2,
        vx: em.dir * 1.8,
        vy: 0,
        life: 180,
      });
    }
  }
  for (let i=wallFireballs.length-1; i>=0; i--) {
    const fb = wallFireballs[i];
    fb.x += fb.vx;
    fb.life--;
    if (fb.life<=0 || isSolid(getTile(Math.floor(fb.x/TILE),Math.floor(fb.y/TILE)))) {
      wallFireballs.splice(i,1); continue;
    }
    // Hit player
    if (!player.invincible &&
        fb.x > player.x-8 && fb.x < player.x+player.w+8 &&
        fb.y > player.y-8 && fb.y < player.y+player.h+8) {
      hurtPlayer();
      spawnParticles(fb.x, fb.y, 5, '#ff4400', 3);
      wallFireballs.splice(i,1);
    }
  }
}

function updateGeysers() {
  for (const g of geysers) {
    g.timer++;
    const period = 200;       // longer full cycle
    const active = (g.timer % period) < 25; // shorter burst
    if (active && g.timer % 4 === 0) {
      const gx = g.col*TILE + TILE/2;
      const gy = 14*TILE;
      geyserParticles.push({
        x: gx + (Math.random()-0.5)*TILE*0.8,
        y: gy,
        vx: (Math.random()-0.5)*1.5,
        vy: -5 - Math.random()*5,
        life: 30+Math.random()*20,
        maxLife: 50,
        color: '#ff6600',
        r: 4+Math.random()*4,
      });
    }
    // Hurt player if standing above active geyser
    if (active) {
      const gx = g.col*TILE;
      if (player.x < gx+TILE && player.x+player.w > gx &&
          player.y+player.h > 12*TILE && player.y < 14*TILE) {
        if (!player.invincible) hurtPlayer();
      }
    }
  }
}

function updateParticles() {
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.2;
    p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i=geyserParticles.length-1; i>=0; i--) {
    const p = geyserParticles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) geyserParticles.splice(i,1);
  }
}

function hurtPlayer() {
  if (player.invincible > 0) return;
  player.hp--;
  player.invincible = 150; // longer grace period
  player.vy = -8;
  sfxHit();
  spawnParticles(player.x+player.w/2, player.y+player.h/2, 10, '#ff4444', 4);
  if (player.hp <= 0) killPlayer();
}

function killPlayer() {
  if (state !== 'play') return;
  lives--;
  sfxDie();
  spawnParticles(player.x+player.w/2, player.y+player.h/2, 20, '#ff4444', 6);
  if (lives <= 0) {
    state = 'dead';
  } else {
    // Respawn
    setTimeout(() => {
      player.x = TILE*2; player.y = TILE*11;
      player.vx = 0; player.vy = 0;
      player.hp = 3; player.invincible = 120;
    }, 800);
    state = 'dead_temp';
    setTimeout(() => { state = 'play'; }, 800);
  }
}

function updateCamera() {
  const targetX = player.x - W/3;
  camX += (targetX - camX) * 0.1;
  if (camX < 0) camX = 0;
  const maxCamX = MAP_COLS*TILE - W;
  if (camX > maxCamX) camX = maxCamX;
}

// ── Draw ──────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  // Tiles
  for (let r=0; r<MAP_ROWS; r++)
    for (let c=0; c<MAP_COLS; c++)
      drawTile(c, r);

  // Coins
  for (const c of coinList) drawCoin(c, c.row, c.col);

  // Geyser particles
  for (const p of geyserParticles) {
    ctx.globalAlpha = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Wall fireballs
  for (const fb of wallFireballs) {
    const glow = Math.sin(frameCount*0.3)*0.3+0.7;
    ctx.fillStyle = '#ff8800';
    ctx.beginPath();
    ctx.arc(fb.x - camX, fb.y, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffdd00';
    ctx.beginPath();
    ctx.arc(fb.x - camX, fb.y, 4, 0, Math.PI*2);
    ctx.fill();
  }

  // Player fireballs
  for (const fb of playerFireballs) {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(fb.x - camX, fb.y, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffdd00';
    ctx.beginPath();
    ctx.arc(fb.x - camX, fb.y, 3, 0, Math.PI*2);
    ctx.fill();
  }

  // Boss fireballs
  for (const fb of bossFireballs) {
    ctx.fillStyle = '#ff2200';
    ctx.beginPath();
    ctx.arc(fb.x - camX, fb.y, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff8800';
    ctx.beginPath();
    ctx.arc(fb.x - camX, fb.y, 4, 0, Math.PI*2);
    ctx.fill();
  }

  // Boss
  if (bossActive) drawBoss(boss);

  // Player
  drawPlayer(player);

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD
  drawHUD();
  drawHpBar(boss);

  // Player HP hearts (bottom-left)
  for (let i=0; i<5; i++) {
    ctx.fillStyle = i < player.hp ? '#ff2244' : '#442244';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('♥', 12 + i*26, H - 12);
  }

  // ── Title screen ──
  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(0, 0, W, H);

    const tg = ctx.createLinearGradient(0, H*0.6, 0, H);
    tg.addColorStop(0, 'rgba(0,0,0,0)');
    tg.addColorStop(1, 'rgba(220,60,0,0.4)');
    ctx.fillStyle = tg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#ffdd00';
    ctx.font = 'bold 72px monospace';
    ctx.fillText('SUPER', W/2, H/2 - 80);
    ctx.fillStyle = '#ff4422';
    ctx.font = 'bold 90px monospace';
    ctx.fillText('JERRY', W/2, H/2);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#cc8844';
    ctx.font = '22px monospace';
    ctx.fillText('LAVA CASTLE', W/2, H/2 + 46);

    if (Math.floor(frameCount / 30) % 2 === 0) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(isMobile ? 'TAP JUMP TO START' : 'PRESS ENTER TO START', W/2, H/2 + 100);
    }

    ctx.fillStyle = '#666';
    ctx.font = '13px monospace';
    ctx.fillText(isMobile
      ? 'D-PAD: Move  JUMP: Jump  FIRE: Shoot fireballs'
      : 'ARROWS: Move  Z/Space/↑: Jump  X: Shoot  R: Restart  F: Fullscreen',
      W/2, H - 28);
  }

  // ── Character select screen ──
  if (state === 'select') {
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    ctx.fillRect(0, 0, W, H);

    const tg2 = ctx.createLinearGradient(0, H*0.7, 0, H);
    tg2.addColorStop(0, 'rgba(0,0,0,0)');
    tg2.addColorStop(1, 'rgba(220,60,0,0.35)');
    ctx.fillStyle = tg2;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffdd00';
    ctx.font = 'bold 36px monospace';
    ctx.fillText('CHOOSE YOUR JERRY', W/2, 70);

    // Draw three character previews
    const positions = [W/2 - 200, W/2, W/2 + 200];
    const PREVIEW_SCALE = 3.5;
    const CHAR_W = 28 * PREVIEW_SCALE;
    const CHAR_H = 32 * PREVIEW_SCALE;
    const previewY = H/2 - CHAR_H/2;

    CHAR_PALETTES.forEach((pal, i) => {
      const cx = positions[i];
      const selected = i === selectedChar;

      // Selection box
      ctx.strokeStyle = selected ? '#ffdd00' : '#444';
      ctx.lineWidth = selected ? 4 : 2;
      ctx.beginPath();
      ctx.roundRect(cx - CHAR_W/2 - 18, previewY - 18, CHAR_W + 36, CHAR_H + 60, 10);
      ctx.stroke();
      if (selected) {
        ctx.fillStyle = 'rgba(255,220,0,0.08)';
        ctx.fill();
      }

      // Draw character preview
      ctx.save();
      ctx.translate(cx - CHAR_W/2, previewY);
      drawJerryBody(pal, false, PREVIEW_SCALE);
      ctx.restore();

      // Name label
      ctx.fillStyle = selected ? '#ffdd00' : '#aaa';
      ctx.font = selected ? 'bold 15px monospace' : '13px monospace';
      ctx.fillText(pal.name, cx, previewY + CHAR_H + 30);

      // Arrow indicator on selected
      if (selected) {
        ctx.fillStyle = '#ffdd00';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillText('▲', cx, previewY + CHAR_H + 58);
      }
    });

    // Navigation hint
    if (Math.floor(frameCount / 30) % 2 === 0) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(isMobile ? 'TAP A COLOUR  •  JUMP TO CONFIRM' : '◀ ▶ TO CHOOSE   ENTER TO PLAY', W/2, H - 60);
    }
    ctx.fillStyle = '#555';
    ctx.font = '13px monospace';
    ctx.fillText('You can always press R to restart and pick again', W/2, H - 28);
  }

  // ── Game Over ──
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff2244';
    ctx.font = 'bold 56px monospace';
    ctx.fillText('GAME OVER', W/2, H/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '22px monospace';
    ctx.fillText(isMobile ? 'Tap RESTART button' : 'Press R to restart', W/2, H/2 + 30);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText(`Final score: ${score}`, W/2, H/2 + 62);
  }

  // ── Win ──
  if (state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffdd00';
    ctx.font = 'bold 64px monospace';
    ctx.fillText('YOU WIN!', W/2, H/2 - 70);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '26px monospace';
    ctx.fillText('King Koopard defeated!', W/2, H/2 - 10);
    ctx.font = '20px monospace';
    ctx.fillText(`Score: ${score}   Coins: ${coins}`, W/2, H/2 + 34);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText(isMobile ? 'Tap RESTART to play again' : 'Press R to play again', W/2, H/2 + 80);
  }

  // ── Boss warning ──
  if (state === 'play' && !bossActive && player.x > BOSS_ARENA_X - TILE*6) {
    ctx.fillStyle = 'rgba(200,0,0,0.85)';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('KING KOOPARD APPROACHES!', W/2, 60);
  }

  // Toast notifications
  drawToasts();

  // On-screen touch controls (drawn last, on top)
  drawTouchControls();
}

// ── Restart ───────────────────────────────────
function restart() {
  // Reset player
  player.x = TILE*2; player.y = TILE*11;
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.ducking = false;
  player.facingRight = true; player.fireMode = true;
  player.invincible = 0; player.hp = 5;
  player.jumping = false;
  // Reset game
  score = 0; lives = 5; coins = 0;
  showToast('Press X to shoot fireballs at enemies!', 200);
  state = 'play';
  camX = 0;
  // Reset boss
  boss.x = TILE*153; boss.y = TILE*10;
  boss.vx = -1.0; boss.vy = 0;
  boss.hp = 6; boss.maxHp = 6; boss.phase = 1;
  boss.fireTimer = 0; boss.fireCooldown = 180;
  boss.jumpTimer = 250; boss.onGround = false;
  boss.dead = false; boss.deathTimer = 0;
  boss.facingRight = false; boss.hitFlash = 0;
  bossActive = false;
  // Reset projectiles & particles
  playerFireballs = []; bossFireballs = []; wallFireballs = [];
  particles = []; geyserParticles = [];
  // Reset coins
  for (const c of coinList) c.collected = false;
  // Reset geysers
  for (const g of geysers) { g.timer = 0; }
}

// ── Main loop ─────────────────────────────────
function loop() {
  frameCount++;

  // Poll gamepad & sync virtual buttons into keys/justPressed
  pollGamepad();
  syncVirtualButtons();

  // Title → character select
  if (state === 'title') {
    if (justPressed['Enter'] || justPressed['Space'] || justPressed['KeyZ'] ||
        justPressed['KeyX']  || justPressed['KeyR']  || vBtn.jump || vBtn.fire) {
      state = 'select';
    }
  }

  // Character select screen
  if (state === 'select') {
    if (justPressed['ArrowLeft']  || (vBtn.left  && !prevVBtn.left))  selectedChar = (selectedChar + 2) % 3;
    if (justPressed['ArrowRight'] || (vBtn.right && !prevVBtn.right)) selectedChar = (selectedChar + 1) % 3;
    if (justPressed['Enter'] || justPressed['Space'] || justPressed['KeyZ'] || vBtn.jump) {
      state = 'play';
      showToast('Press X to shoot fireballs!', 200);
    }
  }

  // Restart (dead / win): go back to character select so they can repick
  if ((justPressed['KeyR'] || (vBtn.restart && !prevVBtn.restart)) &&
      (state === 'dead' || state === 'win')) { restart(); state = 'select'; }

  if (state === 'play') {
    updatePlayer();
    updatePlayerFireballs();
    updateWallFireballs();
    updateGeysers();
    updateBoss();
    updateBossFireballs();
    updateParticles();
    updateCamera();
  } else {
    updateParticles();
    updateCamera();
  }

  // Boss activation zone — show instructions toast when boss appears
  if (!bossActive && player.x > BOSS_ARENA_X - TILE*3 && state==='play') {
    bossActive = true;
    showToast('🔥 Shoot the boss with fireballs! Press X to fire!', 240);
  }

  updateToasts();
  draw();

  // Clear justPressed
  for (const k in justPressed) delete justPressed[k];

  requestAnimationFrame(loop);
}

defineTouchZones(W, H);
requestAnimationFrame(loop);
</script>
